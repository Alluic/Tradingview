name: Z-Score Alert

on:
  schedule:
    # 10:00 AM Eastern. The runtime guard below handles daylight versus standard time.
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Refresh data and print any alert email without sending it"
        required: true
        default: true
        type: boolean

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check 10 AM Eastern schedule guard
        id: time_guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -m tradingview_signal_dashboard.schedule_guard

      - name: Check alert secret presence
        if: steps.time_guard.outputs.should_run == 'true'
        env:
          TV_ALERT_SMTP_HOST: ${{ secrets.TV_ALERT_SMTP_HOST }}
          TV_ALERT_SMTP_PORT: ${{ secrets.TV_ALERT_SMTP_PORT }}
          TV_ALERT_SMTP_USERNAME: ${{ secrets.TV_ALERT_SMTP_USERNAME }}
          TV_ALERT_SMTP_PASSWORD: ${{ secrets.TV_ALERT_SMTP_PASSWORD }}
          TV_ALERT_EMAIL_FROM: ${{ secrets.TV_ALERT_EMAIL_FROM }}
          TV_ALERT_EMAIL_TO: ${{ secrets.TV_ALERT_EMAIL_TO }}
          TV_ALERT_SMTP_USE_TLS: ${{ secrets.TV_ALERT_SMTP_USE_TLS }}
        shell: bash
        run: |
          missing=0
          for name in \
            TV_ALERT_SMTP_HOST \
            TV_ALERT_SMTP_PORT \
            TV_ALERT_SMTP_USERNAME \
            TV_ALERT_SMTP_PASSWORD \
            TV_ALERT_EMAIL_FROM \
            TV_ALERT_EMAIL_TO \
            TV_ALERT_SMTP_USE_TLS
          do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is missing or empty"
              missing=1
            else
              echo "$name is set"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more email secrets are missing. Dry runs can still refresh data; real sends will fail."
          fi

      - name: Refresh data and process alerts
        if: steps.time_guard.outputs.should_run == 'true'
        env:
          TV_ALERT_SMTP_HOST: ${{ secrets.TV_ALERT_SMTP_HOST }}
          TV_ALERT_SMTP_PORT: ${{ secrets.TV_ALERT_SMTP_PORT }}
          TV_ALERT_SMTP_USERNAME: ${{ secrets.TV_ALERT_SMTP_USERNAME }}
          TV_ALERT_SMTP_PASSWORD: ${{ secrets.TV_ALERT_SMTP_PASSWORD }}
          TV_ALERT_EMAIL_FROM: ${{ secrets.TV_ALERT_EMAIL_FROM }}
          TV_ALERT_EMAIL_TO: ${{ secrets.TV_ALERT_EMAIL_TO }}
          TV_ALERT_SMTP_USE_TLS: ${{ secrets.TV_ALERT_SMTP_USE_TLS }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m tradingview_signal_dashboard.alert_runner --dry-run
          else
            python -m tradingview_signal_dashboard.alert_runner
          fi
