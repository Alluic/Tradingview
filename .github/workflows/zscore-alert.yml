name: Z-Score Alert

on:
  schedule:
    # 6:15 PM Eastern during daylight saving time. Adjust to 23:15 UTC during standard time if needed.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh data and send alerts
        env:
          TV_ALERT_SMTP_HOST: ${{ secrets.TV_ALERT_SMTP_HOST }}
          TV_ALERT_SMTP_PORT: ${{ secrets.TV_ALERT_SMTP_PORT }}
          TV_ALERT_SMTP_USERNAME: ${{ secrets.TV_ALERT_SMTP_USERNAME }}
          TV_ALERT_SMTP_PASSWORD: ${{ secrets.TV_ALERT_SMTP_PASSWORD }}
          TV_ALERT_EMAIL_FROM: ${{ secrets.TV_ALERT_EMAIL_FROM }}
          TV_ALERT_EMAIL_TO: ${{ secrets.TV_ALERT_EMAIL_TO }}
          TV_ALERT_SMTP_USE_TLS: ${{ secrets.TV_ALERT_SMTP_USE_TLS }}
        run: python -m tradingview_signal_dashboard.alert_runner
